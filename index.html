<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Meditations</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f5f0e6'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='72' text-anchor='middle' fill='%234a453e' font-style='italic'%3EM%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#f5f0e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meditations">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f5f0e6;
    --bg-soft: #ede7d9;
    --ink: #3d3a35;
    --ink-soft: #7a746a;
    --ink-faint: #b0a89b;
    --accent: #8a6e4b;
    --divider: #e0d8c7;
    --danger: #a85a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    max-width: 680px; margin: 0 auto;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 32px; padding-bottom: 16px;
    border-bottom: 1px solid var(--divider);
  }
  .brand {
    font-style: italic; font-size: 22px; color: var(--ink);
    letter-spacing: 0.5px;
  }
  .brand::first-letter { font-size: 28px; color: var(--accent); }
  .menu-btn {
    background: none; border: none; color: var(--ink-soft);
    font-family: inherit; font-size: 14px; cursor: pointer;
    padding: 6px 10px; border-radius: 4px;
  }
  .menu-btn:hover { background: var(--bg-soft); }

  .today-block { margin-bottom: 48px; }

  .date-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px; gap: 12px;
  }
  .nav-btn {
    background: none; border: none; color: var(--ink-soft);
    font-family: inherit; font-size: 22px; cursor: pointer;
    padding: 4px 10px; border-radius: 4px; line-height: 1;
    min-width: 32px;
  }
  .nav-btn:hover:not(:disabled) { background: var(--bg-soft); color: var(--ink); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }
  .date-title {
    font-size: 20px; font-weight: normal; color: var(--ink);
    letter-spacing: 0.2px; flex: 1; text-align: center;
  }
  .subtitle {
    font-size: 13px; color: var(--ink-soft); font-style: italic;
    margin-bottom: 16px; text-align: center;
  }
  textarea#editor {
    width: 100%; min-height: 320px;
    background: transparent; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 17px; line-height: 1.7;
    color: var(--ink);
    padding: 8px 0;
  }
  textarea#editor::placeholder { color: var(--ink-faint); font-style: italic; }
  textarea#editor:disabled { color: var(--ink-soft); }
  .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; font-size: 12px; color: var(--ink-soft);
  }
  .word-count.warn { color: var(--danger); }
  .save-indicator { font-style: italic; opacity: 0; transition: opacity 0.4s; }
  .save-indicator.show { opacity: 1; }

  .locked-note {
    background: var(--bg-soft); padding: 10px 14px; border-radius: 4px;
    font-size: 13px; color: var(--ink-soft); font-style: italic;
    margin-top: 12px; text-align: center;
  }

  .past-section { margin-top: 24px; }
  .past-header {
    font-size: 12px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--ink-faint); margin-bottom: 20px;
    padding-bottom: 8px; border-bottom: 1px solid var(--divider);
  }
  .past-entry {
    margin-bottom: 32px; opacity: 0.75;
  }
  .past-entry:hover { opacity: 1; }
  .past-date {
    font-size: 15px; color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .past-preview {
    font-size: 14px; color: var(--ink-soft); line-height: 1.55;
    white-space: pre-wrap; word-wrap: break-word;
    max-height: 4.5em; overflow: hidden; cursor: pointer;
  }
  .past-preview.expanded { max-height: none; }
  .past-entry .status {
    font-size: 11px; color: var(--ink-faint); font-style: italic;
    margin-top: 4px;
  }
  .empty {
    color: var(--ink-faint); font-style: italic; font-size: 14px;
    text-align: center; padding: 20px 0;
  }

  .menu-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.3); z-index: 100;
    align-items: flex-start; justify-content: center; padding-top: 80px;
  }
  .menu-overlay.open { display: flex; }
  .menu-panel {
    background: var(--bg); border-radius: 6px;
    padding: 12px; min-width: 220px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .menu-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; padding: 12px 14px;
    font-family: inherit; font-size: 15px; color: var(--ink);
    cursor: pointer; border-radius: 4px;
  }
  .menu-item:hover { background: var(--bg-soft); }
  .menu-item.danger { color: var(--danger); }

  @media (max-width: 480px) {
    .date-title { font-size: 18px; }
    textarea#editor { font-size: 16px; min-height: 280px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Meditations</div>
  <button class="menu-btn" onclick="openMenu()">Menu</button>
</header>

<div class="today-block">
  <div class="date-nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" aria-label="Previous day">‹</button>
    <h1 class="date-title" id="dateTitle"></h1>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" aria-label="Next day">›</button>
  </div>
  <div class="subtitle" id="subtitle">"You could leave life right now. Let that determine what you do and say and think."</div>
  <textarea id="editor" placeholder="Begin..." maxlength="15000"></textarea>
  <div class="meta">
    <span class="word-count" id="wordCount">0 / 1500 words</span>
    <span class="save-indicator" id="saveIndicator">saved</span>
  </div>
  <div class="locked-note" id="lockedNote" style="display:none;"></div>
</div>

<div class="past-section">
  <div class="past-header">Archive</div>
  <div id="pastList"></div>
</div>

<div class="menu-overlay" id="menuOverlay" onclick="if(event.target===this)closeMenu()">
  <div class="menu-panel">
    <button class="menu-item" onclick="goToday()">Jump to today</button>
    <button class="menu-item" onclick="exportCurrent()">Export current day</button>
    <button class="menu-item" onclick="exportAll()">Export all entries</button>
    <button class="menu-item danger" onclick="wipeAll()">Delete everything</button>
  </div>
</div>

<script>
const DB_NAME = 'meditations';
const STORE = 'entries';
const WORD_LIMIT = 1500;

let db;
let saveTimer;
let viewingDate; // ISO key of the day currently shown

// ---- Date helpers ----
const pad = n => String(n).padStart(2, '0');
const dateToKey = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const keyToDate = (k) => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => dateToKey(new Date());
const shiftKey = (key, days) => { const d = keyToDate(key); d.setDate(d.getDate()+days); return dateToKey(d); };
const fullDate = (key) => keyToDate(key).toLocaleDateString('en-US', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
});
const filenameDate = (key) => fullDate(key).replace(/,/g,'').replace(/\s+/g,'-');

// Editable window: yesterday, today, tomorrow
function isEditable(key) {
  const today = todayKey();
  return key === today || key === shiftKey(today, -1) || key === shiftKey(today, 1);
}
function editStatus(key) {
  const today = todayKey();
  if (key === today) return 'today';
  if (key === shiftKey(today, -1)) return 'yesterday — editable until end of today';
  if (key === shiftKey(today, 1)) return 'tomorrow — you can pre-write';
  if (keyToDate(key) < keyToDate(shiftKey(today, -1))) return 'locked';
  return 'future — not yet available';
}

// ---- IndexedDB ----
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'date' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}
function getEntry(date) {
  return new Promise((resolve) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(date);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
function saveEntry(date, text) {
  return new Promise((resolve) => {
    const now = Date.now();
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    const getReq = store.get(date);
    getReq.onsuccess = () => {
      const existing = getReq.result;
      store.put({
        date, text,
        createdAt: existing?.createdAt || now,
        updatedAt: now
      });
    };
    tx.oncomplete = () => resolve();
  });
}
function getAllEntries() {
  return new Promise((resolve) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => {
      const entries = req.result || [];
      entries.sort((a,b) => b.date.localeCompare(a.date));
      resolve(entries);
    };
    req.onerror = () => resolve([]);
  });
}
function deleteAll() {
  return new Promise((resolve) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
  });
}

// ---- Rendering ----
function countWords(text) {
  const t = text.trim();
  return t ? t.split(/\s+/).length : 0;
}

async function renderView() {
  document.getElementById('dateTitle').textContent = fullDate(viewingDate);
  const entry = await getEntry(viewingDate);
  const editor = document.getElementById('editor');
  const lockedNote = document.getElementById('lockedNote');
  const subtitle = document.getElementById('subtitle');

  editor.value = entry?.text || '';
  updateWordCount();

  const editable = isEditable(viewingDate);
  editor.disabled = !editable;

  const status = editStatus(viewingDate);
  const today = todayKey();

  if (viewingDate === today) {
    subtitle.textContent = '"You could leave life right now. Let that determine what you do and say and think."';
    subtitle.style.display = '';
    lockedNote.style.display = 'none';
    editor.placeholder = 'Begin...';
  } else if (viewingDate === shiftKey(today, -1)) {
    subtitle.style.display = 'none';
    lockedNote.textContent = 'Yesterday — editable until end of today.';
    lockedNote.style.display = '';
    editor.placeholder = 'Yesterday was blank.';
  } else if (viewingDate === shiftKey(today, 1)) {
    subtitle.style.display = 'none';
    lockedNote.textContent = 'Tomorrow — pre-write for the day ahead.';
    lockedNote.style.display = '';
    editor.placeholder = 'Something to remember for tomorrow...';
  } else if (keyToDate(viewingDate) > keyToDate(today)) {
    subtitle.style.display = 'none';
    lockedNote.textContent = 'Not yet available.';
    lockedNote.style.display = '';
    editor.placeholder = '';
  } else {
    subtitle.style.display = 'none';
    lockedNote.textContent = 'Locked. Read only.';
    lockedNote.style.display = '';
    editor.placeholder = '(no entry)';
  }

  // Disable "next" if going past tomorrow, "prev" always allowed
  document.getElementById('nextBtn').disabled =
    keyToDate(viewingDate) >= keyToDate(shiftKey(today, 1));

  await renderPast();
}

function updateWordCount() {
  const text = document.getElementById('editor').value;
  const count = countWords(text);
  const el = document.getElementById('wordCount');
  el.textContent = `${count} / ${WORD_LIMIT} words`;
  el.classList.toggle('warn', count > WORD_LIMIT);
}

async function renderPast() {
  const entries = await getAllEntries();
  const past = entries.filter(e => e.date !== viewingDate);
  const list = document.getElementById('pastList');

  if (past.length === 0) {
    list.innerHTML = '<div class="empty">No other entries yet.</div>';
    return;
  }
  list.innerHTML = past.map(e => {
    const status = editStatus(e.date);
    const preview = escapeHtml(e.text || '(empty)');
    return `
      <div class="past-entry" onclick="jumpTo('${e.date}')">
        <div class="past-date">${fullDate(e.date)}</div>
        <div class="past-preview">${preview}</div>
        <div class="status">${status}</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Navigation ----
function navigate(days) {
  viewingDate = shiftKey(viewingDate, days);
  renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function jumpTo(key) {
  viewingDate = key;
  renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goToday() {
  closeMenu();
  viewingDate = todayKey();
  renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---- Editor ----
function setupEditor() {
  const editor = document.getElementById('editor');
  editor.addEventListener('input', () => {
    updateWordCount();
    if (editor.disabled) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      await saveEntry(viewingDate, editor.value);
      showSaved();
    }, 500);
  });
}
function showSaved() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

// ---- Menu / Export ----
function openMenu() { document.getElementById('menuOverlay').classList.add('open'); }
function closeMenu() { document.getElementById('menuOverlay').classList.remove('open'); }

async function tryDownload(filename, text) {
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) {
      const blob = new Blob([text], {type: 'text/plain'});
      await dl.save({ filename, data: blob });
      return;
    }
  } catch (e) {}
  const blob = new Blob([text], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
async function exportCurrent() {
  closeMenu();
  const entry = await getEntry(viewingDate);
  const text = entry?.text || '';
  if (!text.trim()) { alert('Nothing to export yet.'); return; }
  const body = `${fullDate(viewingDate)}\n\n${text}\n`;
  await tryDownload(`${filenameDate(viewingDate)}.txt`, body);
}
async function exportAll() {
  closeMenu();
  const entries = await getAllEntries();
  if (entries.length === 0) { alert('No entries to export.'); return; }
  entries.sort((a,b) => a.date.localeCompare(b.date));
  const body = entries.map(e => `${fullDate(e.date)}\n\n${e.text || '(empty)'}\n`).join('\n\n---\n\n');
  await tryDownload(`Meditations-all-${todayKey()}.txt`, body);
}
async function wipeAll() {
  closeMenu();
  if (!confirm('Delete every entry permanently? This cannot be undone.')) return;
  if (!confirm('Really sure? Everything will be gone.')) return;
  await deleteAll();
  document.getElementById('editor').value = '';
  updateWordCount();
  renderPast();
}

// ---- Init ----
(async function init() {
  db = await openDB();
  viewingDate = todayKey();
  await renderView();
  setupEditor();
  setInterval(renderPast, 60000);
  let currentDay = todayKey();
  setInterval(() => {
    const now = todayKey();
    if (now !== currentDay) {
      currentDay = now;
      if (viewingDate === shiftKey(now, -1) || viewingDate === now) {
        viewingDate = now;
        renderView();
      } else {
        renderPast();
      }
    }
  }, 30000);
})();
</script>
</body>
</html>
